<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pt-nav</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    #banner {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000;
      background: rgba(26, 26, 46, 0.92);
      color: #b0b0cc;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid #2a2a4a;
      white-space: nowrap;
      pointer-events: none;
    }
    #banner.err { color: #ee6666; }

    /* ── Mobile layout ── */

    /* ── Route panel ── */
    #route-panel {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1000;
      background: rgba(15, 15, 26, 0.95);
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px;
      width: 264px;
    }

    /* ── Mobile layout ── */
    @media (max-width: 600px) {
      #route-panel {
        top: auto; left: 0; right: 0;
        bottom: 0;
        width: 100%;
        border-radius: 14px 14px 0 0;
        border-left: none; border-right: none; border-bottom: none;
        padding: 14px 16px;
        padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      }

      .rp-dropdown {
        bottom: 100%; top: auto;
        border-radius: 6px 6px 0 0;
        border-top: 1px solid #2a2a4a;
        border-bottom: none;
        max-height: 40vh;
      }

      #banner { display: none; }

    }

    .rp-field { position: relative; margin-bottom: 8px; }

    .rp-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4444aa;
      margin-bottom: 4px;
    }

    .rp-input {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.82rem;
      padding: 7px 10px;
      outline: none;
    }
    .rp-input:focus { border-color: #4444aa; }
    .rp-input::placeholder { color: #333366; }

    .rp-dropdown {
      display: none;
      position: absolute;
      left: 0; right: 0; top: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 1002;
    }

    .rp-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      color: #ccccee;
      cursor: pointer;
    }
    .rp-item:hover { background: #2a2a4a; }

    .rp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .rp-btn {
      width: 100%;
      padding: 8px;
      background: #2a2a6a;
      color: #aaaaff;
      border: 1px solid #3a3a8a;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 2px;
    }
    .rp-btn:disabled {
      background: #1a1a2e; color: #333366;
      border-color: #2a2a4a; cursor: not-allowed;
    }
    .rp-btn:not(:disabled):hover { background: #3a3a8a; }

    #route-result {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a4a;
    }
    .rs-total    { font-size: 1rem; font-weight: 600; color: #ccccee; margin-bottom: 4px; }
    .rs-breakdown { font-size: 0.75rem; color: #6666aa; margin-bottom: 8px; }
    .rs-clear {
      font-size: 0.72rem; color: #444488;
      background: none; border: none;
      cursor: pointer; text-decoration: underline;
    }
    .rs-clear:hover { color: #7878ff; }

    .popup-actions { display: flex; gap: 6px; margin-top: 8px; }
    .pa-btn {
      flex: 1; padding: 4px 0; font-size: 0.72rem;
      background: #1a1a2e; color: #8888cc;
      border: 1px solid #2a2a4a; border-radius: 4px; cursor: pointer;
    }
    .pa-btn:hover { background: #2a2a4a; color: #aaaaff; }

    #panel-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #2a2a4a;
      text-align: center;
    }
    #panel-footer a {
      font-size: 0.72rem;
      color: #4444aa;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #panel-footer a:hover { color: #7878ff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="banner">Loading stations&hellip;</div>

  <div id="route-panel">
    <div class="rp-field">
      <span class="rp-label">From</span>
      <input id="from-input" class="rp-input" type="text"
             placeholder="MRT or YouBike station&hellip;" autocomplete="off">
      <div id="from-dropdown" class="rp-dropdown"></div>
    </div>
    <div class="rp-field">
      <span class="rp-label">To</span>
      <input id="to-input" class="rp-input" type="text"
             placeholder="MRT or YouBike station&hellip;" autocomplete="off">
      <div id="to-dropdown" class="rp-dropdown"></div>
    </div>
    <button id="route-btn" class="rp-btn" disabled>Find Route</button>
    <div id="route-result" style="display:none">
      <div class="rs-total" id="rs-total"></div>
      <div class="rs-breakdown" id="rs-breakdown"></div>
      <button class="rs-clear" id="clear-btn">Clear route</button>
    </div>
    <div id="panel-footer">
      <a href="/graph.html">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="2.5" r="2" fill="currentColor"/>
          <circle cx="2.5" cy="14" r="2" fill="currentColor"/>
          <circle cx="15.5" cy="14" r="2" fill="currentColor"/>
          <line x1="9" y1="2.5" x2="2.5" y2="14" stroke="currentColor" stroke-width="1.4"/>
          <line x1="9" y1="2.5" x2="15.5" y2="14" stroke="currentColor" stroke-width="1.4"/>
          <line x1="2.5" y1="14" x2="15.5" y2="14" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        The Network
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? ''
      : 'https://pt-nav.tunglin.workers.dev';

    const map = L.map('map', { zoomControl: true }).setView([25.05, 121.55], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);

    const mrtLineLayer = L.layerGroup().addTo(map);
    const mrtLayer     = L.layerGroup().addTo(map);
    const bikeLayer    = L.layerGroup().addTo(map);
    const isMobile = window.innerWidth < 600;
    L.control.layers(null, {
      'MRT Lines': mrtLineLayer, 'MRT Stations': mrtLayer, 'YouBike Stations': bikeLayer,
    }, { collapsed: isMobile, position: 'topright' }).addTo(map);

    fetch(`${API}/mrt/lines`)
      .then(r => r.json())
      .then(lines => {
        lines.forEach(line => {
          const coords = line.stations.map(s => [s.lat, s.lng]);
          L.polyline(coords, { color: line.color, weight: 4, opacity: 0.75 }).addTo(mrtLineLayer);
        });
      });

    const banner = document.getElementById('banner');

    function firstColor(csv) {
      if (!csv) return '#888888';
      const c = csv.split(',')[0].trim();
      return c.startsWith('#') ? c : '#' + c;
    }

    // Registry maps node ID -> { id, name, type } for popup click handlers
    const _reg = {};

    function _popupActions(nodeId) {
      return `<div class="popup-actions">
        <button class="pa-btn" onclick="setStationFromMap('from','${nodeId}')">Set Start</button>
        <button class="pa-btn" onclick="setStationFromMap('to','${nodeId}')">Set End</button>
      </div>`;
    }

    function renderMRT(stations) {
      stations.forEach(s => {
        const nodeId = `mrt:${s.station_id}`;
        const name   = s.name_zh + (s.name_en ? ` ${s.name_en}` : '');
        _reg[nodeId] = { id: nodeId, name, type: 'mrt' };
        L.circleMarker([s.lat, s.lng], {
          radius: 7, color: '#ffffff', weight: 1.5,
          fillColor: firstColor(s.line_colors), fillOpacity: 0.92,
        })
        .bindPopup(`<b>${s.name_zh}</b>${s.name_en ? '<br>' + s.name_en : ''}` +
          (s.line_ids ? `<br><small style="color:#888">${s.line_ids.replace(/,/g, ' · ')}</small>` : '') +
          _popupActions(nodeId))
        .addTo(mrtLayer);
      });
    }

    function renderYouBike(stations) {
      stations.forEach(s => {
        const nodeId = `bike:${s.station_id}`;
        const name   = s.name_zh.replace('YouBike2.0_', '').replace('YouBike_', '');
        _reg[nodeId] = { id: nodeId, name, type: 'bike' };
        L.circleMarker([s.lat, s.lng], {
          radius: 4, color: '#ffffff', weight: 1,
          fillColor: '#22cc66', fillOpacity: 0.85,
        })
        .bindPopup(`<b>${name}</b>` +
          (s.name_en ? `<br><small>${s.name_en}</small>` : '') +
          `<br><small style="color:#888">${s.city}</small>` +
          _popupActions(nodeId))
        .addTo(bikeLayer);
      });
    }

    fetch(`${API}/stations`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        renderMRT(data.mrt);
        renderYouBike(data.youbike);
        banner.textContent = `${data.mrt.length} MRT stations · ${data.youbike.length} YouBike stations`;
      })
      .catch(() => {
        banner.className = 'err';
        banner.textContent = 'API unreachable — start the backend to load stations';
      });

    // ── Route panel ───────────────────────────────────────────────────────────

    const SEG_WEIGHTS = { mrt: 5, bike: 3, walk: 2 };
    const MODE_LABELS = { mrt: 'MRT', bike: 'YouBike', walk: 'Walk' };
    const MODE_ICONS  = { mrt: '🚇', bike: '🚲', walk: '🚶' };

    function makePin(color, letter) {
      return L.divIcon({
        className: '',
        html: `<svg width="22" height="30" viewBox="0 0 22 30" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 0 C5 0 0 5 0 11 C0 19 11 30 11 30 C11 30 22 19 22 11 C22 5 17 0 11 0 Z"
                fill="${color}" stroke="white" stroke-width="1.5"/>
          <text x="11" y="14" text-anchor="middle" dominant-baseline="middle"
                fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">${letter}</text>
        </svg>`,
        iconSize:   [22, 30],
        iconAnchor: [11, 30],
      });
    }

    let fromStation = null;
    let toStation   = null;
    let routeLayers = [];

    function setStation(role, station) {
      if (role === 'from') {
        fromStation = station;
        document.getElementById('from-input').value = station.name;
      } else {
        toStation = station;
        document.getElementById('to-input').value = station.name;
      }
      updateRouteBtn();
    }

    // Called from popup button onclick attributes
    function setStationFromMap(role, nodeId) {
      setStation(role, _reg[nodeId]);
      map.closePopup();
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function showDropdown(dropdown, items, onPick) {
      if (!items.length) { hideDropdown(dropdown); return; }
      dropdown.innerHTML = items.map((s, i) =>
        `<div class="rp-item" data-i="${i}">
          <span class="rp-dot" style="background:${s.type === 'mrt' ? '#7878ff' : '#22cc66'}"></span>
          ${s.name}
        </div>`
      ).join('');
      dropdown.style.display = 'block';
      dropdown.querySelectorAll('.rp-item').forEach((el, i) =>
        el.addEventListener('mousedown', () => onPick(items[i]))
      );
    }

    function hideDropdown(el) { el.style.display = 'none'; el.innerHTML = ''; }

    function setupAutocomplete(inputEl, dropdownEl, onPick) {
      const doSearch = debounce(async q => {
        if (q.length < 2) { hideDropdown(dropdownEl); return; }
        const r = await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
        showDropdown(dropdownEl, await r.json(), station => {
          inputEl.value = station.name;
          hideDropdown(dropdownEl);
          onPick(station);
        });
      }, 300);

      inputEl.addEventListener('input', () => doSearch(inputEl.value));
      inputEl.addEventListener('blur',  () => setTimeout(() => hideDropdown(dropdownEl), 150));
    }

    function updateRouteBtn() {
      document.getElementById('route-btn').disabled = !(fromStation && toStation);
    }

    setupAutocomplete(
      document.getElementById('from-input'),
      document.getElementById('from-dropdown'),
      s => setStation('from', s)
    );
    setupAutocomplete(
      document.getElementById('to-input'),
      document.getElementById('to-dropdown'),
      s => setStation('to', s)
    );

    function clearRoute() {
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];
      document.getElementById('route-result').style.display = 'none';
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      clearRoute();
      ['from-input', 'to-input'].forEach(id => document.getElementById(id).value = '');
      fromStation = toStation = null;
      updateRouteBtn();
    });

    document.getElementById('route-btn').addEventListener('click', async () => {
      clearRoute();
      const btn = document.getElementById('route-btn');
      btn.textContent = 'Routing…';
      btn.disabled = true;

      try {
        const r = await fetch(`${API}/route`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from_id: fromStation.id, to_id: toStation.id }),
        });
        if (!r.ok) throw new Error('No route');
        const data = await r.json();
        drawRoute(data);
        showSummary(data);
      } catch {
        document.getElementById('rs-total').textContent     = 'No route found';
        document.getElementById('rs-breakdown').textContent = '';
        document.getElementById('route-result').style.display = 'block';
      } finally {
        btn.textContent = 'Find Route';
        btn.disabled = !(fromStation && toStation);
      }
    });

    function drawRoute(data) {
      const wpMap = {};
      data.waypoints.forEach(w => { wpMap[w.id] = [w.lat, w.lng]; });

      data.segments.forEach(seg => {
        routeLayers.push(
          L.polyline([wpMap[seg.from], wpMap[seg.to]], {
            color: seg.color, weight: SEG_WEIGHTS[seg.type], opacity: 0.85,
          }).addTo(map)
        );
      });

      [
        { w: data.waypoints[0],                         icon: makePin('#22aa55', 'Start') },
        { w: data.waypoints[data.waypoints.length - 1], icon: makePin('#dd2222', 'End') },
      ].forEach(({ w, icon }) =>
        routeLayers.push(L.marker([w.lat, w.lng], { icon }).addTo(map))
      );

      map.fitBounds(
        L.latLngBounds(data.waypoints.map(w => [w.lat, w.lng])),
        { padding: [60, 60] }
      );
    }

    function showSummary(data) {
      const modeTimes = { mrt: 0, bike: 0, walk: 0 };
      data.segments.forEach(s => { modeTimes[s.type] += s.seconds; });
      const parts = Object.entries(modeTimes)
        .filter(([, s]) => s > 0)
        .map(([type, secs]) => `${MODE_ICONS[type]} ${MODE_LABELS[type]} ${Math.round(secs / 60)} min`);
      document.getElementById('rs-total').textContent      = `~${data.total_minutes} min total`;
      document.getElementById('rs-breakdown').textContent  = parts.join(' · ');
      document.getElementById('route-result').style.display = 'block';
    }
  </script>
</body>
</html>
